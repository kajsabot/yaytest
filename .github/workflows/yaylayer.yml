# Generated by `yay gate`. The real gate is this check PLUS a branch-protection rule on
# main that REQUIRES the "gate" check (see the printed steps).
# Until yay-layer is published to npm, change the install line to:  npm install -g github:jonas-developer/yay-layer
name: YayLayer
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install YayLayer
        run: npm install -g yay-layer
      - name: Verify the gate
        run: yay verify --strict --root 8100-9831-548B-C3FF
